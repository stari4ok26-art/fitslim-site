<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Дякуємо за заявку — FitSlim</title>
  <meta name="description" content="Дякуємо за заявку. Ми скоро зв’яжемося з вами." />

  <style>
    :root {
      --dark: #0f172a;
      --green: #22c55e;
      --green-dark: #16a34a;
      --white: #ffffff;
      --muted: #64748b;
      --light: #f8fafc;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--dark);
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.18), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(249, 115, 22, 0.16), transparent 30%),
        linear-gradient(135deg, #f8fafc, #ecfdf5);
    }

    .thank-you-card {
      width: min(720px, 100%);
      padding: 42px;
      text-align: center;
      background: var(--white);
      border-radius: 32px;
      box-shadow: var(--shadow);
    }

    .icon {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      color: #052e16;
      background: var(--green);
      border-radius: 50%;
      font-size: 44px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
    }

    p {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 32px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 900;
      text-decoration: none;
      transition: 0.2s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    .primary {
      color: #052e16;
      background: var(--green);
    }

    .primary:hover {
      color: var(--white);
      background: var(--green-dark);
    }

    .secondary {
      color: var(--dark);
      background: #e2e8f0;
    }

    .small {
      margin-top: 24px;
      font-size: 14px;
      color: #94a3b8;
    }

    @media (max-width: 520px) {
      .thank-you-card {
        padding: 30px 22px;
        border-radius: 24px;
      }

      .actions {
        flex-direction: column;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="thank-you-card">
    <div class="icon">✓</div>

    <h1>Дякуємо за заявку!</h1>

    <p>
      Ми отримали твоє повідомлення і скоро зв’яжемося для підтвердження програми.
      Перевір телефон, Telegram або email, який ти вказав у заявці.
    </p>

    <div class="actions">
      <a class="primary" href="index.html">Повернутися на сайт</a>
      <a class="secondary" href="index.html#programs">Переглянути програми</a>
    </div>

    <p class="small">
      FitSlim · Тренування · Схуднення · Правильне харчування
    </p>
  </main>
</body>
</html>
